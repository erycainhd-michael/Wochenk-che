<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Mise</title>
    <meta name="description" content="Persönlicher Wochenplaner für Ernährung, Einkauf und Kochen" />
    <meta name="theme-color" content="#f3f5f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1512" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mise" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- Google Sans Flex, nicht blockierend geladen: Hängt der Abruf, startet die App trotzdem (mit Systemschrift) -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&family=Noto+Serif:wght@400;600;700&display=swap" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-icon"><div class="splash-board">
        <img class="sp-bg" src="icons/splash/brett.webp" alt="" />
        <div class="sp-items">
          <img class="sp" data-n="onions" src="icons/splash/onions.webp" alt="" style="left:0.0%;top:52.17%;width:49.0%;height:41.85%" />
          <img class="sp" data-n="beans" src="icons/splash/beans.webp" alt="" style="left:52.54%;top:4.08%;width:47.46%;height:53.8%" />
          <img class="sp" data-n="garlic" src="icons/splash/garlic.webp" alt="" style="left:14.13%;top:5.16%;width:26.54%;height:26.54%" />
          <img class="sp" data-n="soy" src="icons/splash/soy.webp" alt="" style="left:43.48%;top:13.95%;width:17.12%;height:17.12%" />
          <img class="sp" data-n="lemon" src="icons/splash/lemon.webp" alt="" style="left:3.53%;top:29.08%;width:27.26%;height:27.26%" />
          <img class="sp" data-n="herbs" src="icons/splash/herbs.webp" alt="" style="left:29.44%;top:29.44%;width:26.54%;height:26.54%" />
          <img class="sp" data-n="pepper" src="icons/splash/pepper.webp" alt="" style="left:47.46%;top:46.56%;width:30.16%;height:30.16%" />
          <img class="sp" data-n="salt" src="icons/splash/salt.webp" alt="" style="left:82.43%;top:52.17%;width:16.76%;height:16.76%" />
          <img class="sp" data-n="broth" src="icons/splash/broth.webp" alt="" style="left:67.03%;top:65.58%;width:30.71%;height:30.71%" />
          <img class="sp" data-n="wedge" src="icons/splash/wedge.webp" alt="" style="left:26.45%;top:49.82%;width:16.49%;height:14.76%" />
          <img class="sp" data-n="clove1" src="icons/splash/clove1.webp" alt="" style="left:39.13%;top:6.52%;width:9.69%;height:9.33%" />
          <img class="sp" data-n="clove2" src="icons/splash/clove2.webp" alt="" style="left:7.52%;top:19.38%;width:8.7%;height:10.05%" />
        </div>
        <img class="sp-full" src="icons/splash/icon-rund.webp" alt="" />
      </div></div>
      <div class="splash-name">Mise</div>
    </div>
    <script>
      // Startanimation: Stop-Motion – die Schüsseln wandern über das Brett, füllen und leeren sich
      // und landen am Ende an ihrem Platz (= App-Icon). Läuft sofort, noch bevor die App geladen ist.
      (function () {
        var sp = document.getElementById('splash');
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) { sp.classList.add('done'); return; }
        var board = sp.querySelector('.splash-board');
        var els = [].slice.call(sp.querySelectorAll('.sp'));
        var by = {};
        els.forEach(function (e) { by[e.dataset.n] = e; });
        var bowls = ['garlic', 'soy', 'lemon', 'herbs', 'pepper', 'salt', 'broth'];
        // Je Bild: Schüssel → Platz einer anderen Schüssel, Füllstand (Größe, abwechselnd voll/leer), leichte Drehung
        var frames = [
          { perm: [4, 6, 0, 5, 2, 3, 1], s: [0.45, 0.9], r: 9 },
          { perm: [1, 4, 6, 0, 5, 2, 3], s: [0.75, 0.55], r: -7 },
          { perm: [5, 3, 1, 6, 0, 4, 2], s: [0.95, 0.7], r: 5 },
          { perm: [2, 0, 3, 1, 6, 5, 4], s: [0.8, 1.05], r: -4 },
          { perm: [0, 1, 2, 3, 4, 5, 6], s: [1.06, 1.04], r: 2 },
          { perm: [0, 1, 2, 3, 4, 5, 6], s: [1, 1], r: 0 },
        ];
        var others = { beans: [[-9, 7], [6, -5], [-4, 3], [2, -1]], onions: [[8, -9], [-5, 6], [3, -4], [-1, 1]], wedge: [[30, -6], [-12, 24], [14, 9], [-3, 2]], clove1: [[-20, 30], [16, 12], [-8, -6], [2, 1]], clove2: [[40, 10], [12, 34], [-4, 8], [1, -1]] };
        function center(e) { return [e.offsetLeft + e.offsetWidth / 2, e.offsetTop + e.offsetHeight / 2]; }
        var i = 0;
        function step() {
          var f = frames[i], W = board.offsetWidth / 100;
          bowls.forEach(function (n, k) {
            var e = by[n], a = center(e), b = center(by[bowls[f.perm[k]]]);
            var s = f.s[k % 2];
            e.style.transform = 'translate(' + (b[0] - a[0]) + 'px,' + (b[1] - a[1]) + 'px) rotate(' + (k % 2 ? f.r : -f.r) + 'deg) scale(' + s + ')';
          });
          Object.keys(others).forEach(function (n) {
            var o = others[n][Math.min(i, 3)], last = i >= 4;
            by[n].style.transform = last ? '' : 'translate(' + o[0] * W + 'px,' + o[1] * W + 'px) rotate(' + o[0] / 2 + 'deg) scale(' + (0.6 + i * 0.1) + ')';
          });
          sp.classList.add('go');
          if (++i < frames.length) setTimeout(step, 150);
          else setTimeout(function () { sp.classList.add('done'); }, 160);
        }
        setTimeout(step, 120);
      })();
    </script>
    <div id="app"><main class="view"><p class="sub center">Lade …</p></main></div>
    <noscript>Diese App braucht JavaScript.</noscript>
    <script>
      // Notbremse: Startet die App nicht, Fehler anzeigen und „Reparieren“ anbieten.
      // Reparieren löscht nur den Offline-Zwischenspeicher – deine Pläne und Einstellungen bleiben.
      (function () {
        function show(msg) {
          if (window.__miseStarted) return;
          var el = document.getElementById('app');
          el.innerHTML =
            '<main class="view"><div class="card"><h2>Mise startet gerade nicht</h2>' +
            '<p class="sub">' + String(msg || 'Die App lädt nicht vollständig.').replace(/</g, '&lt;') + '</p>' +
            '<button class="btn primary block" id="mise-repair">App reparieren</button>' +
            '<p class="sub">Deine Pläne, Häkchen und Einstellungen bleiben erhalten.</p></div></main>';
          document.getElementById('mise-repair').onclick = function () {
            var jobs = [];
            if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
            if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
            Promise.all(jobs).then(function () { location.replace(location.pathname + '?r=' + Date.now() + '#/woche'); }, function () { location.reload(); });
          };
        }
        window.addEventListener('error', function (e) { show('Fehler: ' + (e.message || e.type)); }, true);
        window.addEventListener('unhandledrejection', function (e) { show('Fehler: ' + ((e.reason && e.reason.message) || e.reason)); });
        setTimeout(function () { show(); }, 8000);
      })();
    </script>
    <script>
      // Kein Heranzoomen (iOS ignoriert user-scalable=no teilweise)
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
    </script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
