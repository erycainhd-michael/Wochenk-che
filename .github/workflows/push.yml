name: Wochenplan-Benachrichtigung

on:
  schedule:
    # Montag 9:00 Uhr Berliner Zeit. Cron läuft in UTC, daher zwei Einträge:
    - cron: '0 7 * * 1' # Sommerzeit (MESZ = UTC+2)
    - cron: '0 8 * * 1' # Winterzeit (MEZ = UTC+1)
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Push senden (nur wenn die Secrets eingerichtet sind)
        env:
          CRON_SCHEDULE: ${{ github.event.schedule }}
          TARGET_HOUR: '9'
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
        run: node scripts/send-push.mjs
