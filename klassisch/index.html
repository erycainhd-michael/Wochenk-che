<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Mise (klassisch)</title>
    <meta name="description" content="Persönlicher Wochenplaner für Ernährung, Einkauf und Kochen" />
    <meta name="theme-color" content="#f3f5f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1512" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mise" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- Google Sans Flex, nicht blockierend geladen: Hängt der Abruf, startet die App trotzdem (mit Systemschrift) -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&display=swap" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg class="leaf" viewBox="0 0 120 120">
        <defs><linearGradient id="leafg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1f7a4d" /><stop offset="1" stop-color="#4cc488" /></linearGradient></defs>
        <path class="stem" d="M47 85 L33 101" />
        <g class="blade">
          <path class="blade-fill" d="M47 85 C38 58 58 28 97 21 C93 55 77 82 47 85 Z" fill="url(#leafg)" />
          <path class="vein" d="M47 85 Q70 57 92 27" />
        </g>
      </svg>
      <div class="splash-name">Mise</div>
    </div>
    <div id="app"><main class="view"><p class="sub center">Lade …</p></main></div>
    <noscript>Diese App braucht JavaScript.</noscript>
    <script>
      // Notbremse: Startet die App nicht, Fehler anzeigen und „Reparieren“ anbieten.
      // Reparieren löscht nur den Offline-Zwischenspeicher – deine Pläne und Einstellungen bleiben.
      (function () {
        function show(msg) {
          if (window.__miseStarted) return;
          var el = document.getElementById('app');
          el.innerHTML =
            '<main class="view"><div class="card"><h2>Mise startet gerade nicht</h2>' +
            '<p class="sub">' + String(msg || 'Die App lädt nicht vollständig.').replace(/</g, '&lt;') + '</p>' +
            '<button class="btn primary block" id="mise-repair">App reparieren</button>' +
            '<p class="sub">Deine Pläne, Häkchen und Einstellungen bleiben erhalten.</p></div></main>';
          document.getElementById('mise-repair').onclick = function () {
            var jobs = [];
            if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
            if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
            Promise.all(jobs).then(function () { location.replace(location.pathname + '?r=' + Date.now() + '#/woche'); }, function () { location.reload(); });
          };
        }
        window.addEventListener('error', function (e) { show('Fehler: ' + (e.message || e.type)); }, true);
        window.addEventListener('unhandledrejection', function (e) { show('Fehler: ' + ((e.reason && e.reason.message) || e.reason)); });
        setTimeout(function () { show(); }, 8000);
      })();
    </script>
    <script>
      // Kein Heranzoomen (iOS ignoriert user-scalable=no teilweise)
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
    </script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
